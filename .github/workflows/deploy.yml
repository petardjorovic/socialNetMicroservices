name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # Docker Hub login
      # ---------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------
      # Build & Push images
      # ---------------------------
      - name: Build & Push Docker images
        run: |
          docker build -t petardjorovic/socialnetmicroservices-api-gateway:latest ./api-gateway
          docker push petardjorovic/socialnetmicroservices-api-gateway:latest

          docker build -t petardjorovic/socialnetmicroservices-identity-service:latest ./identity-service
          docker push petardjorovic/socialnetmicroservices-identity-service:latest

          docker build -t petardjorovic/socialnetmicroservices-post-service:latest ./post-service
          docker push petardjorovic/socialnetmicroservices-post-service:latest

          docker build -t petardjorovic/socialnetmicroservices-media-service:latest ./media-service
          docker push petardjorovic/socialnetmicroservices-media-service:latest

          docker build -t petardjorovic/socialnetmicroservices-search-service:latest ./search-service
          docker push petardjorovic/socialnetmicroservices-search-service:latest

      # ---------------------------
      # Deploy to VPS
      # ---------------------------
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/var/projects/socialNetMicroservices
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
