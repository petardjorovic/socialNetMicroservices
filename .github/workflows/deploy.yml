name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create API gateway env
        run: echo "${{ secrets.API_GATEWAY_ENV }}" > ./api-gateway/.env.prod

      - name: Create Identity service env
        run: echo "${{ secrets.IDENTITY_SERVICE_ENV }}" > ./identity-service/.env.prod

      - name: Create Post service env
        run: echo "${{ secrets.POST_SERVICE_ENV }}" > ./post-service/.env.prod

      - name: Create Media service env
        run: echo "${{ secrets.MEDIA_SERVICE_ENV }}" > ./media-service/.env.prod

      - name: Create Search service env
        run: echo "${{ secrets.SEARCH_SERVICE_ENV }}" > ./search-service/.env.prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        uses: docker/setup-docker-action@v4
        with:
          compose-version: "1.29.2"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          docker-compose -f docker-compose.yml build --pull
          docker-compose -f docker-compose.yml push

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{  secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/var/projects/socialNetMicroservices
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans
